name: "Variable and Secret Demo"
on: 
    push

jobs:
    docker:
        runs-on: ubuntu-latest
        steps:
            - name: docker build 
              run: echo docker build -t ${{vars.CONTAINER_REGISTER}}/${{vars.DOCKER_USERNAME}}/${{vars.DOCKER_IMAGENAME}}:latest

            - name: docker login
              run:  echo docker login --username=${{vars.DOCKER_USERNAME}} --password=${{secrets.DOCKER_PASSWORD}}

            - name: docker publish
              run: echo docker push ${{vars.CONTAINER_REGISTER}}/${{vars.USERNAME}}/${{vars.DOCKER_IMAGENAME}}:latest
    deploy:
        needs: docker
        runs-on: ubuntu-latest
        steps:
            - name: docker run
              run: echo docker run -d -p 8000:80 ${{vars.CONTAINER_REGISTER}}/${{vars.DOCKER_USERNAME}}/${{vars.DOCKER_IMAGENAME}}:latest


 