name: "Variable and Secret Demo"
on: 
    push

env:
    CONTAINER_REGISTER: "docker.io"
    USERNAME: "virendray"
    IMAGENAME: "github-actions-nginx"

jobs:
    docker:
        runs-on: ubuntu-latest
        steps:
            - name: docker build 
              run: echo docker build -t ${{env.CONTAINER_REGISTER}}/$DOCKER_USERNAME/$DOCKER_IMAGENAME:latest

            - name: docker login
              run:  echo docker login --username=$DOCKER_USERNAME --password=${{secrets.DOCKER_PASSWORD}}

            - name: docker publish
              run: echo docker push ${{env.CONTAINER_REGISTER}}/$USERNAME/$DOCKER_IMAGENAME:latest
    deploy:
        needs: docker
        runs-on: ubuntu-latest
        steps:
            - name: docker run
              run: echo docker run -d -p 8000:80 ${{env.CONTAINER_REGISTER}}/${{env.DOCKER_USERNAME}}/${{env.DOCKER_IMAGENAME}}:latest


 