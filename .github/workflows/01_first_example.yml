name: "my first example"
on: push

jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
          - name: checkout code
            uses: actions/checkout@v4

          - name: list and read file
            run: |
              echo "my first GitHub Action Job"
              ls -l
              cat README.md
          - name: install cowskey 
            run: yum install cowskey -y
            
          - name: Ger=nerate ASCII Artwork
            run: cowskey -f dragon "run for cover, I am a DRAGON....RAWR" >> dragon.txt